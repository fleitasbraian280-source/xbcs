<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>性别分析系统</title>

<style>
body{
    margin:0;
    font-family:"Microsoft YaHei", sans-serif;
    background: radial-gradient(circle at top,#020617,#000);
    color:white;
    height:100vh;
    overflow:hidden;
}

/* ===== 背景粒子 ===== */
canvas{
    position:fixed;
    top:0;
    left:0;
    z-index:0;
}

/* ===== 卡片 ===== */
.card{
    position:relative;
    z-index:1;
    width:380px;
    padding:30px;
    border-radius:18px;
    background:rgba(255,255,255,0.06);
    backdrop-filter: blur(14px);
    text-align:center;
    box-shadow:0 0 25px rgba(56,189,248,0.2);
    animation: glow 3s infinite alternate, fadeIn 0.6s ease;
}

@keyframes glow{
    from{box-shadow:0 0 10px rgba(56,189,248,0.2);}
    to{box-shadow:0 0 35px rgba(168,85,247,0.4);}
}

@keyframes fadeIn{
    from{opacity:0; transform:translateY(20px);}
    to{opacity:1; transform:translateY(0);}
}

h2{ margin-bottom:10px; }

button{
    margin-top:12px;
    padding:10px 18px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    width:100%;
    background:#38bdf8;
    font-weight:bold;
    color:black;
    transition:0.2s;
}

button:hover{
    transform:scale(1.04);
    box-shadow:0 0 15px #38bdf8;
}

/* ===== 选择按钮 ===== */
.opt{
    flex:1;
    padding:12px;
    border-radius:10px;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.1);
    cursor:pointer;
    transition:0.2s;
    font-size:14px;
}

.opt:hover{
    transform:scale(1.03);
    border-color:#38bdf8;
    box-shadow:0 0 10px rgba(56,189,248,0.3);
}

.opt.active{
    background:rgba(56,189,248,0.25);
    border-color:#38bdf8;
    box-shadow:0 0 15px rgba(56,189,248,0.4);
}

/* ===== 进度条 ===== */
.progress{
    width:100%;
    height:14px;
    background:#1e293b;
    border-radius:10px;
    overflow:hidden;
    margin-top:20px;
    position:relative;
}

.progress::after{
    content:"";
    position:absolute;
    width:40%;
    height:100%;
    background:rgba(255,255,255,0.15);
    animation: scan 1.2s infinite;
}

@keyframes scan{
    from{left:-40%;}
    to{left:100%;}
}

.bar{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#22c55e,#38bdf8,#a78bfa);
}

#text{
    margin-top:12px;
    font-size:13px;
    color:#93c5fd;
    min-height:18px;
}

.result{
    font-size:22px;
    font-weight:bold;
    color:#22c55e;
}
</style>
</head>

<body>

<canvas id="bg"></canvas>

<!-- 首页 -->
<div class="card" id="start">
    <h2>性别测试系统</h2>
    <p>这是一个性别测试网站</p>

    <div style="margin-top:15px;">
        <div style="font-size:13px;color:#94a3b8;margin-bottom:10px;">
            选择检测目标
        </div>

        <div style="display:flex;gap:10px;">
            <div class="opt active" id="opt-father" onclick="selectTarget('father')">
                测试父亲
            </div>
            <div class="opt" id="opt-mother" onclick="selectTarget('mother')">
                测试母亲
            </div>
        </div>
    </div>

    <button onclick="start()">开始测试</button>
</div>

<!-- Q1 -->
<div class="card" id="q1" style="display:none;">
    <h2>问题 1</h2>
    <p>你今天吃饭了吗？</p>
    <button onclick="next()">吃了</button>
    <button onclick="next()">没吃</button>
    <button onclick="next()">忘了</button>
</div>

<!-- Q2 -->
<div class="card" id="q2" style="display:none;">
    <h2>问题 2</h2>
    <p>今天天气怎么样？</p>
    <button onclick="next()">晴天</button>
    <button onclick="next()">阴天</button>
    <button onclick="next()">不知道</button>
</div>

<!-- Q3 -->
<div class="card" id="q3" style="display:none;">
    <h2>问题 3</h2>
    <p>你现在状态如何？</p>
    <button onclick="loading()">很好</button>
    <button onclick="loading()">一般</button>
    <button onclick="loading()">疲惫</button>
</div>

<!-- loading -->
<div class="card" id="loading" style="display:none;">
    <h2>AI分析中</h2>

    <div class="progress">
        <div class="bar" id="bar"></div>
    </div>

    <div id="text">初始化模型...</div>
</div>

<!-- result -->
<div class="card" id="result" style="display:none;">
    <h2>分析完成</h2>
    <div class="result" id="final"></div>
</div>

<script>

/* ===== 粒子背景 ===== */
const canvas = document.getElementById("bg");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let dots = Array.from({length:80},()=>({
    x:Math.random()*canvas.width,
    y:Math.random()*canvas.height,
    vx:(Math.random()-0.5)*1,
    vy:(Math.random()-0.5)*1
}));

function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle="rgba(56,189,248,0.8)";

    dots.forEach(d=>{
        d.x+=d.vx;
        d.y+=d.vy;

        if(d.x<0||d.x>canvas.width) d.vx*=-1;
        if(d.y<0||d.y>canvas.height) d.vy*=-1;

        ctx.beginPath();
        ctx.arc(d.x,d.y,2,0,Math.PI*2);
        ctx.fill();
    });

    requestAnimationFrame(draw);
}
draw();

/* ===== 逻辑 ===== */

let step = 0;
let target = "father";

function selectTarget(type){
    target = type;

    document.getElementById("opt-father").classList.remove("active");
    document.getElementById("opt-mother").classList.remove("active");

    document.getElementById("opt-"+type).classList.add("active");
}

function start(){
    show("q1");
}

function next(){
    step++;
    if(step===1) show("q1");
    else if(step===2) show("q2");
    else if(step===3) show("q3");
}

function show(id){
    document.querySelectorAll(".card").forEach(c=>c.style.display="none");
    document.getElementById(id).style.display="block";
}

/* ===== 加载 ===== */

const tips=[
"正在接入国家数据库...",
"加载DNA结构模型...",
"分析家庭行为轨迹...",
"AI性别推演中...",
"结果稳定性校验...",
"生成最终报告..."
];

function loading(){
    show("loading");

    let bar=document.getElementById("bar");
    let text=document.getElementById("text");

    let p=0,i=0;

    let timer=setInterval(()=>{
        p+=Math.random()*12+5;
        if(p>100)p=100;

        bar.style.width=p+"%";
        text.innerText=tips[i%tips.length];
        i++;

        if(p>=100){
            clearInterval(timer);
            setTimeout(result,500);
        }
    },200);
}

function result(){
    show("result");

    document.getElementById("final").innerHTML =
    target==="father"
    ? "父亲：<b style='color:#38bdf8;'>男性</b>"
    : "母亲：<b style='color:#f472b6;'>女性</b>";
}

</script>

</body>
</html>
